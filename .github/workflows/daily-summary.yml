name: Daily Horizon Summary

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: cd Horizon && uv sync

      - name: Prepare GitHub Actions config
        run: cp Horizon/data/config.github.json Horizon/data/config.json

      - name: Run Horizon
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: cd Horizon && uv run horizon --hours 24

      - name: Copy ZH summary to quick capture
        run: |
          # 定时在 UTC 22:00 = GMT+8 次日 06:00 触发,必须用 GMT+8 日期,否则存成前一天的文件
          DATE=$(TZ='Asia/Shanghai' date +'%Y-%m-%d')
          ZH_FILE="Horizon/data/summaries/horizon-${DATE}-zh.md"
          ZH_JSON="Horizon/data/summaries/horizon-${DATE}-zh.json"
          mkdir -p "01_快捕区"
          if [ -f "$ZH_FILE" ]; then
            cp "$ZH_FILE" "01_快捕区/Agent日报-${DATE}.md"
            echo "Markdown copied OK"
          else
            echo "ZH summary not found: $ZH_FILE"
          fi
          if [ -f "$ZH_JSON" ]; then
            cp "$ZH_JSON" "01_快捕区/Agent日报-${DATE}.json"
            echo "JSON copied OK"
          else
            echo "ZH brief JSON not found: $ZH_JSON"
          fi

      - name: Commit summary to main branch
        run: |
          # 定时在 UTC 22:00 = GMT+8 次日 06:00 触发,必须用 GMT+8 日期,否则存成前一天的文件
          DATE=$(TZ='Asia/Shanghai' date +'%Y-%m-%d')
          MD_FILE="01_快捕区/Agent日报-${DATE}.md"
          JSON_FILE="01_快捕区/Agent日报-${DATE}.json"
          git config user.name "Horizon Bot"
          git config user.email "horizon@bot.local"
          if [ -f "$MD_FILE" ]; then
            git add "$MD_FILE"
          fi
          if [ -f "$JSON_FILE" ]; then
            git add "$JSON_FILE"
          fi
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "📋 Agent日报 ${DATE}"
            git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
            # 远端可能已有新提交（如 cron 修改），先 fetch+rebase 再 push，失败则重试
            for i in 1 2 3; do
              if git fetch origin && git rebase origin/main && git push; then
                echo "Pushed OK"
                break
              fi
              echo "Push attempt $i failed, retrying..."
              sleep 5
            done
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./Horizon/docs
          keep_files: true
          commit_message: "📝 Daily Summary: ${{ env.DATE }}"
          publish_branch: gh-pages
          enable_jekyll: true

name: Daily Horizon Summary

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: cd Horizon && uv sync

      - name: Prepare GitHub Actions config
        run: cp Horizon/data/config.github.json Horizon/data/config.json

      - name: Run Horizon
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: cd Horizon && uv run horizon --hours 24

      - name: Copy ZH summary to quick capture
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          DATE=$(date +'%Y-%m-%d')
          ZH_FILE="Horizon/data/summaries/horizon-${DATE}-zh.md"
          if [ -f "$ZH_FILE" ]; then
            DEST="01_快捕区/Agent日报-${DATE}.md"
            cp "$ZH_FILE" "$DEST"
            echo "Copied to $DEST"
          else
            echo "ZH summary not found: $ZH_FILE"
            ls -la Horizon/data/summaries/ 2>/dev/null || echo "No summaries dir"
          fi

      - name: Commit summary to main branch
        run: |
          DATE=$(date +'%Y-%m-%d')
          git config user.name "Horizon Bot"
          git config user.email "horizon@bot.local"
          git add "01_快捕区/Agent日报-${DATE}.md" 2>/dev/null || true
          if git diff --cached --name-only | grep -q "01_快捕区"; then
            git commit -m "📋 Agent日报 ${DATE}"
            git push
            echo "Committed and pushed"
          else
            echo "No new summary to commit"
          fi

      - name: Set current date as environment variable
        run: echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./Horizon/docs
          keep_files: true
          commit_message: "📝 Daily Summary: ${{ env.DATE }}"
          publish_branch: gh-pages
          enable_jekyll: true
